[project]
name = "apiverve-charadesgenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Charades Generator provides random words from curated categories perfect for playing the classic charades acting game."
keywords = ["charades", "word game", "party game", "acting game", "charades words"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/charades?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/charades?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/charades-api"
Twitter = "https://twitter.com/apivervehq"
